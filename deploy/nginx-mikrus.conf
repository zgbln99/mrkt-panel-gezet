# Konfiguracja nginx dla VPS-a w Mikr.usie (i każdego innego hostingu, który
# daje wyłącznie wybrane porty TCP na współdzielonym adresie IPv4).
#
# Plik generuje deploy/install.sh, podmieniając DOMENA_APLIKACJI i PORT_HTTPS.
#
# Skąd taki układ:
#   • Na IPv4 adres jest współdzielony między klientów, więc porty 80 i 443
#     nie należą do nas — dostajemy dwa własne porty (u nas: PORT_HTTPS).
#   • Na IPv6 mamy pełny, własny adres i możemy słuchać na czym chcemy,
#     łącznie ze standardowym portem 443.
# Stąd jeden blok z trzema gniazdami: przydzielony port po IPv4 i IPv6 oraz
# standardowy 443 wyłącznie po IPv6.
#
# Certyfikat Let's Encrypt wydaje się przez walidację po IPv6 na porcie 80 —
# tam akurat port należy do nas.

limit_req_zone $binary_remote_addr zone=gezet_api:10m rate=10r/s;

# ── HTTP po IPv6: wyzwanie ACME i przekierowanie na właściwy adres ──────
server {
    listen [::]:80;
    server_name DOMENA_APLIKACJI;
    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type "text/plain";
    }

    # Przekierowanie zawsze na port — to jeden adres działający i po IPv4,
    # i po IPv6, więc zespół ma jedną wersję do zapamiętania.
    location / {
        return 301 https://$host:PORT_HTTPS$request_uri;
    }
}

# ── Żądania z niepasującą nazwą hosta ──────────────────────────────────
# Współdzielony adres IPv4 obsługuje wielu klientów, a nasz port jest
# publiczny — bez tego bloku aplikacja odpowiadałaby na każde żądanie
# trafiające w port, także skanerom pytającym o cudze domeny.
server {
    # Parametry gniazda (http2) ustawia się przy PIERWSZYM bloku nasłuchującym
    # na danym adresie i porcie — stąd http2 jest tutaj, a nie w bloku aplikacji.
    # Składnia `listen ... http2` zamiast dyrektywy `http2 on`, bo ta druga
    # pojawiła się dopiero w nginx 1.25.1, a Ubuntu 24.04 wozi 1.24.
    listen 0.0.0.0:PORT_HTTPS ssl http2 default_server;
    listen [::]:PORT_HTTPS ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name _;

    ssl_certificate     /etc/letsencrypt/live/DOMENA_APLIKACJI/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/DOMENA_APLIKACJI/privkey.pem;

    return 444;
}

# ── Właściwa aplikacja ─────────────────────────────────────────────────
server {
    # Ta sama treść pod trzema gniazdami: przydzielony port po obu rodzinach
    # adresów oraz standardowy 443, dostępny wyłącznie po IPv6.
    listen 0.0.0.0:PORT_HTTPS ssl;
    listen [::]:PORT_HTTPS ssl;
    listen [::]:443 ssl;
    server_name DOMENA_APLIKACJI;
    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/DOMENA_APLIKACJI/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/DOMENA_APLIKACJI/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    client_max_body_size 512k;

    access_log /var/log/nginx/gezet-marketing.access.log;
    error_log  /var/log/nginx/gezet-marketing.error.log;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 1024;

    location /api/ {
        limit_req zone=gezet_api burst=20 nodelay;

        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # Nagłówki cache dla plików statycznych ustawia aplikacja — patrz komentarz
    # w deploy/nginx.conf.
    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

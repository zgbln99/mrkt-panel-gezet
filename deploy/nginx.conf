# Konfiguracja nginx dla aplikacji "Zgłoszenia Marketing Gezet".
#
# Instalacja:
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/gezet-marketing
#   sudo sed -i 's/TWOJA-DOMENA.PL/marketing.firma.pl/g' /etc/nginx/sites-available/gezet-marketing
#   sudo ln -sf /etc/nginx/sites-available/gezet-marketing /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d marketing.firma.pl      # doda blok HTTPS i przekierowanie
#
# Aplikacja Node nasłuchuje wyłącznie na 127.0.0.1:4000 i serwuje zarówno API,
# jak i zbudowany frontend — nginx jest tu warstwą TLS, limitów i cache'u.

# Limit żądań na poziomie nginx-a — pierwsza linia obrony, zanim ruch w ogóle
# dotrze do Node. Limity aplikacyjne (express-rate-limit) działają niezależnie.
limit_req_zone $binary_remote_addr zone=gezet_api:10m rate=10r/s;

server {
    listen 80;
    # Nasłuch IPv6 celowo wyłączony domyślnie: na VPS-ie z wyłączonym IPv6
    # dyrektywa `listen [::]:80` wywala nginx-a błędem
    # "Address family not supported by protocol" i usługa w ogóle nie wstaje.
    # Jeśli Twój serwer ma IPv6, odkomentuj poniższą linię.
    # listen [::]:80;
    server_name TWOJA-DOMENA.PL;

    # certbot podmieni ten blok na przekierowanie do HTTPS.
    # Do tego czasu aplikacja działa po HTTP — nie loguj się przed
    # uruchomieniem certyfikatu, bo hasło pojedzie otwartym tekstem.

    # Rozmiar zgłoszenia z formularza jest niewielki; wyższy limit tylko
    # ułatwiałby zapychanie serwera.
    client_max_body_size 512k;

    # Nie ujawniamy wersji nginx-a w nagłówkach i na stronach błędów.
    server_tokens off;

    access_log /var/log/nginx/gezet-marketing.access.log;
    error_log  /var/log/nginx/gezet-marketing.error.log;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 1024;

    location /api/ {
        limit_req zone=gezet_api burst=20 nodelay;

        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # Nagłówki cache dla plików statycznych ustawia aplikacja (pliki z hashem
    # w nazwie dostają rok i `immutable`, index.html `no-cache`). Powielanie
    # tego tutaj przez `expires`/`add_header` dawało dwa nagłówki
    # Cache-Control w jednej odpowiedzi.
    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# Konfiguracja nginx dla wdrożenia BEZ DOMENY — aplikacja pod samym adresem IPv4.
#
# Plik generuje deploy/install.sh (podmienia SERWER-IP). Ręcznie:
#   sudo sed 's/SERWER-IP/203.0.113.10/g' deploy/nginx-ip.conf \
#     > /etc/nginx/sites-available/gezet-marketing
#
# UWAGA: blok TLS wymaga istniejącego certyfikatu w /etc/letsencrypt/live/gezet-ip/.
# Dopóki go nie ma, nginx nie wystartuje — install.sh dlatego najpierw stawia
# wariant tylko po HTTP, wydaje certyfikat, a dopiero potem wgrywa ten plik.

limit_req_zone $binary_remote_addr zone=gezet_api:10m rate=10r/s;

# ── HTTP: wyzwanie ACME i przekierowanie na HTTPS ──────────────────────
server {
    listen 80 default_server;
    server_name _;
    server_tokens off;

    # Certyfikaty dla adresów IP są krótkie (160 godzin), więc odnowienie
    # przechodzi tędy co kilka dni. Ta lokalizacja musi zostać na HTTP —
    # przekierowanie zepsułoby walidację.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS: właściwa aplikacja ──────────────────────────────────────────
server {
    # Składnia `listen ... http2` zamiast osobnej dyrektywy `http2 on` —
    # ta druga pojawiła się dopiero w nginx 1.25.1, a Ubuntu 24.04 wozi 1.24.
    listen 443 ssl http2 default_server;
    server_name SERWER-IP;
    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/gezet-ip/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gezet-ip/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    # Zszywanie OCSP celowo wyłączone: przy certyfikatach sześciodniowych
    # nie ma czego odwoływać, a Let's Encrypt wygasił usługę OCSP.
    ssl_stapling off;

    client_max_body_size 512k;

    access_log /var/log/nginx/gezet-marketing.access.log;
    error_log  /var/log/nginx/gezet-marketing.error.log;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 1024;

    location /api/ {
        limit_req zone=gezet_api burst=20 nodelay;

        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # Nagłówki cache dla plików statycznych ustawia aplikacja — patrz komentarz
    # w deploy/nginx.conf.
    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# Konfiguracja nginx dla wdrożenia wyłącznie po IPv6.
#
# Sens: na hostingu ze współdzielonym adresem IPv4 (np. Mikr.us) porty 80 i 443
# na IPv4 należą do dostawcy, ale na IPv6 mamy własny adres i pełną swobodę.
# Aplikacja stoi więc pod czystym adresem, bez numeru portu — kosztem tego, że
# sieci bez IPv6 w ogóle jej nie zobaczą.
#
# Plik generuje deploy/install.sh, podmieniając DOMENA_APLIKACJI.
# W DNS ma być WYŁĄCZNIE rekord AAAA — rekord A wskazywałby na współdzielony
# adres dostawcy i osoby bez IPv6 dostawałyby błąd certyfikatu zamiast
# czytelnego "nie znaleziono serwera".

limit_req_zone $binary_remote_addr zone=gezet_api:10m rate=10r/s;

# ── HTTP: wyzwanie ACME i przekierowanie na HTTPS ──────────────────────
server {
    listen [::]:80;
    server_name DOMENA_APLIKACJI;
    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── Żądania z niepasującą nazwą hosta ──────────────────────────────────
server {
    # Składnia `listen ... ssl http2` zamiast dyrektywy `http2 on` — ta druga
    # pojawiła się w nginx 1.25.1, a Ubuntu 24.04 wozi 1.24. Parametry gniazda
    # ustawia pierwszy blok nasłuchujący na danym porcie, stąd http2 tutaj.
    listen [::]:443 ssl http2 default_server;
    server_name _;

    ssl_certificate     /etc/letsencrypt/live/DOMENA_APLIKACJI/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/DOMENA_APLIKACJI/privkey.pem;

    return 444;
}

# ── Właściwa aplikacja ─────────────────────────────────────────────────
server {
    listen [::]:443 ssl;
    server_name DOMENA_APLIKACJI;
    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/DOMENA_APLIKACJI/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/DOMENA_APLIKACJI/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    client_max_body_size 512k;

    access_log /var/log/nginx/gezet-marketing.access.log;
    error_log  /var/log/nginx/gezet-marketing.error.log;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 1024;

    location /api/ {
        limit_req zone=gezet_api burst=20 nodelay;

        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
